server:
  port: 3000

app:
  # In Java ZoneOffset notation (https://docs.oracle.com/javase/8/docs/api/java/time/ZoneOffset.html#of-java.lang.String-)
  # 'Z' is code for UTC
  timezone: Z

api:
  # Should an authorization token be required?
  requireAuthorization: true
  # Auth token (must be included in calls to this app if enabled).
  # Set MTX_AUTH_TOKEN in the environment before starting the service.
  authToken: ${MTX_AUTH_TOKEN}
  # Should calls to /kv/get-all include lastModifiedTimestamps? (more resource intensive)
  includeTimestampsInGetAll: true

db:
  # Should key-value pairs be backed up in an external database? (postgres)
  useDb: true
  # Frequency to store data to db (in minutes)
  storeInterval: 5
  # Run all insert statements at once? True means only one SQL statement needs to be run, but if it fails then all values
  # will fail to insert. False means many SQL statements need to be run but if any errors only that one will fail.
  insertAllAtOnce: true

nosql:
  # Should key-value pairs be backed up in a Valkey database?
  useNosql: false

rcon:
  # Should the /rcon/send endpoint be available?
  enabled: false
  host: localhost
  port: 25575
  # Set MTX_RCON_PASSWORD in the environment before starting the service.
  password: ${MTX_RCON_PASSWORD:}
  connectTimeoutMillis: 5000
  readTimeoutMillis: 5000

spring:
  data:
    redis:
      # Valkey speaks the Redis protocol; use redis:// or rediss:// for TLS.
      url: redis://localhost:6379
  datasource:
    url: jdbc:postgresql://localhost:5432/mtxkvstore
    username: mtxkvstore
    password: mtxkvstore
  flyway:
    enabled: true
    baseline-on-migrate: true
    default-schema: MtxKvStore
